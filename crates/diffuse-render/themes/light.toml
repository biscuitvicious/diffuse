# Canonical light theme — bundled asset.
#
# The authoritative light palette, pinned against the frozen legacy values by
# the equivalence tests in `theme/toml/parse.rs` (see `themes/dark.toml` for
# the cursor-axis mapping notes).

name = "default"
mode = "light"
dark_pair = "dark"

[ui]
bg_base = "#fafafa"
text = "#24292f"       # legacy `text`
bg_modal = "#ffffff"    # legacy `modal_bg`
warning = "#b45000"
note = "#965f00"
accent = "#0969da"
status_bar_bg = "#ebeef2"
status_bar_fg = "#24292f"
status_bar_dim = "#697382"
status_bar_accent = "#aa5a00"
ribbon_divider = "#b9bec8"
ribbon_text = "#697382"
header_bar_bg = "#ebeef2"
header_bar_fg = "#24292f"
header_repo = "#0a55b9"
header_branch = "#24292f"
header_dim = "#697382"
header_staged = "#1a7f37"
header_prefix = "#0f6e82"
scrollbar_thumb = "#b4b9c3"
scrollbar_track = "#f0f2f5"
modal_border = "#b9bec8"
modal_title = "#24292f"
modal_text = "#24292f"
modal_dim = "#697382"
modal_selected_bg = "#dce8fc"
modal_selected_fg = "#0a55b9"
count_dels = "#cf222e"
count_adds = "#1a7f37"
count_mods = "#aa5a00"
count_movs = "#6e2882"
count_notes = "#965f00"

[rest.file_header]      # rest state
bg = "#f0f3f8"
fg = "#3c506e"
path = "#233250"        # legacy `file_header_path_rest`

[rest.hunk_divider]     # rest state
bg = "primary"          # legacy `hunk_divider_bg_rest` = Color::Primary
fg = "#6e2882"

[rest.band]             # visual-selection band (legacy `band_bg`)
bg = "#f3f5f8"

[rest.ctx]              # context rows outside the current hunk
bg = "#fafafa"
fg = "#24292f"
num = "#afb8c1"
icon = "#afb8c1"

[rest.ctx.syntax]
text = "#24292f"       # legacy `text`
url = "#697382"         # legacy parity: context rows render Url with the comment color

[rest.add]
bg = "#e6f6ec"
fill = "#ace0ba"
fg = "#1a7f37"
num = "#1a7f37"
icon = "#1a7f37"

[rest.add.syntax]
url = "#646973"         # explicit `add_url` (differs from the ctx comment mapping)

[rest.del]
bg = "#ffebec"
fill = "#ffb2b8"
fg = "#cf222e"
num = { color = "#cf222e", italic = true }
icon = "#cf222e"

[rest.del.syntax]
text = "#cf222e"
string = "#b41e28"
char_literal = "#be2d37"
url = "#646973"
code = "#b41e28"

[rest.mod]              # modification rows inherit their syntax from ctx
bg = "#f5f5f7"
fill = "#ace0ba"
fg = "#24292f"
num = "#aa5a00"
icon = "#aa5a00"

[rest.movsrc]           # pre-image relocation source (cascades from del, 50/50 del + mov purple)
bg = "#faeef6"
fill = "#ecbcdc"
fg = "#932252"
num = { color = "#932252", italic = true }
icon = "#6e2882"

[rest.movsrc.syntax]
text = "#24292f"
string = "#872664"
char_literal = "#992f70"
code = "#872664"

[rest.movtgt]           # post-image relocation target (inherits ctx; overridable)
icon = "#6e2882"

[file.file_header]      # current-file state
bg = "#e4ecf8"
fg = "#194ba0"
path = "#0f234b"        # legacy `file_header_path_current`

[file.hunk_divider]
bg = "#eeeef6"
fg = "#6e2882"

[hunk.ctx]              # context rows inside the current hunk
num = "#656d76"
icon = "#656d76"

[row.file_header]       # selected state
bg = "#d7e4fa"
fg = "#0f3c8c"
path = "#051941"        # legacy `file_header_path_selected`

[row.hunk_divider]
bg = "#e1e1ee"
fg = "#8c2da5"

[row.ctx]               # legacy `ctx_cursor_bg`
bg = "#e8ebf0"

[row.add]               # legacy `add_cursor_bg` / `add_fill_cursor_bg`
bg = "#cdeed7"
fill = "#91d2a2"
fg = "#1a7f37"

[row.del]               # legacy `del_cursor_bg` (fill-cursor: RowStyle carries none)
bg = "#ffd4d7"
fill = "none"
fg = "#cf222e"

[row.mod]               # legacy `mod_cursor_bg` / `mod_fill_cursor_bg`
bg = "#e6e8ec"
fill = "#91d2a2"
fg = "#24292f"

[row.movsrc]            # cursor row on MovSrc (mirrors row.del, 50/50 del + mov purple)
bg = "#f3d9ea"
fill = "none"
fg = "#932252"
