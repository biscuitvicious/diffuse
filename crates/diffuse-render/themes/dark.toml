# Canonical dark theme — bundled asset.
#
# Byte-for-byte equivalent to the legacy flat dark palette
# (`theme/palette/dark.rs`): the equivalence tests in `theme/toml/parse.rs`
# freeze this mapping (phase 4). Until phases 5-7 migrate renderers, the
# legacy palette remains authoritative for consumers; these assets become
# authoritative at migration.
#
# Cursor axis: REST state at `Cursor::Rest`, CURRENT at `Cursor::File`,
# SELECTED at `Cursor::Row`. Banner `path` colors and the visual-selection
# band (`band`) are tier surfaces; the `[row.*]` tables carry the interactive
# cursor/fill backgrounds.

name = "default"
mode = "dark"
light_pair = "light"

[ui]
bg_base = 233
text = "primary"       # legacy `text` (terminal default)
bg_modal = 236          # legacy `modal_bg`
warning = 220
note = 220
accent = 51
status_bar_bg = 234
status_bar_fg = 252
status_bar_dim = 244
status_bar_accent = 220
ribbon_divider = 244
ribbon_text = 244
header_bar_bg = 234
header_bar_fg = 231
header_repo = 117
header_branch = 252
header_dim = 244
header_staged = 120
header_prefix = 152
scrollbar_thumb = 244
scrollbar_track = 233
modal_border = 240
modal_title = 231
modal_text = 250
modal_dim = 242
modal_selected_bg = 239
modal_selected_fg = 248
count_dels = 203
count_adds = 120
count_mods = 214
count_movs = 147
count_notes = 220

[rest.file_header]      # rest state
bg = 233
fg = 214
path = 251              # legacy `file_header_path_rest`

[rest.hunk_divider]     # rest state
bg = "primary"          # legacy `hunk_divider_bg_rest` = Color::Primary
fg = 213

[rest.band]             # visual-selection band (legacy `band_bg`)
bg = 235

[rest.ctx]              # context rows outside the current hunk
bg = 233
fg = "primary"
num = 238
icon = 238

[rest.ctx.syntax]
url = 150               # legacy parity: context rows render Url with the comment color

[rest.add]
bg = "#1c321e"
fill = "#1e6032"
fg = 120
num = 120
icon = 120

[rest.add.syntax]
url = 250               # explicit `add_url` (differs from the ctx comment mapping)

[rest.del]
bg = "#260c0e"
fill = "#521c20"
fg = 203
num = { color = 203, italic = true }
icon = 203

[rest.del.syntax]
keyword = 183
typ = 215
function = 159
number = 222
literal = 222
comment = 224
operator = 153
text = "primary"
bold = 222
italic = 224
link = 153
url = 248
string = 203
char_literal = 210
code = 203
table_header = 224

[rest.mod]              # modification rows inherit their syntax from ctx
bg = "#262626"
fill = "#1e6032"
fg = 245
num = 214
icon = 214

[rest.mov]              # shared relocation channel for both sides
bg = 233
fg = 245
num = 147
icon = 117

[file.file_header]      # current-file state
bg = 235
fg = 220
path = 254              # legacy `file_header_path_current`

[file.hunk_divider]
bg = 235
fg = 213

[hunk.ctx]              # context rows inside the current hunk
num = 245
icon = 245

[row.file_header]       # selected state
bg = 238
fg = 221
path = 255              # legacy `file_header_path_selected`

[row.hunk_divider]
bg = 238
fg = "#ff9bff"

[row.ctx]               # legacy `ctx_cursor_bg`
bg = 237

[row.add]               # legacy `add_cursor_bg` / `add_fill_cursor_bg`
bg = "#2e4a30"
fill = "#257841"
fg = 120

[row.del]               # legacy `del_cursor_bg` (fill-cursor: RowStyle carries none)
bg = "#44181a"
fill = "none"
fg = 203

[row.mod]               # legacy `mod_cursor_bg` / `mod_fill_cursor_bg`
bg = "#424242"
fill = "#257841"
fg = 245

[row.mov]               # legacy `mov_cursor_bg`
bg = 237
fg = 245
