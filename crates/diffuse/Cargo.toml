[package]
name = "diffuse"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "diff-engine token-stream & terminal renderer"

[lib]
name = "diffuse"
path = "src/lib.rs"

[[bin]]
name = "diffuse"
path = "src/main.rs"

[[bin]]
name = "harvest"
path = "src/bin/harvest.rs"

[dependencies]
diffuse-algo = { workspace = true }
diffuse-core = { workspace = true }
diffuse-git = { workspace = true }
diffuse-render = { workspace = true }
diffuse-syntax = { workspace = true }
diffuse-tui = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
flate2 = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
yansi = { workspace = true }

[dev-dependencies]
difflib = { workspace = true }
rayon = { workspace = true }
tempfile = { workspace = true }
nix = { version = "0.31", features = ["term"] }
