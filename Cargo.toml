[workspace]
resolver = "2"
members = [
    "crates/*",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
diffuse-algo = { path = "crates/diffuse-algo", version = "0.1.0" }
diffuse-syntax = { path = "crates/diffuse-syntax", version = "0.1.0" }
diffuse-core = { path = "crates/diffuse-core", version = "0.1.0" }
diffuse-render = { path = "crates/diffuse-render", version = "0.1.0" }
diffuse-tui = { path = "crates/diffuse-tui", version = "0.1.0" }

clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
regex = "1"
smallvec = "1"
difflib = "0.4"
crossterm = "0.29"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
unicode-segmentation = "1.13.3"
unicode-width = "0.2"
gix = { version = "0.87", default-features = false, features = ["basic", "revision", "blob-diff", "parallel", "sha1"] }
rayon = "1.12"
rustc-hash = "2"
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
pulldown-cmark = { version = "0.13", default-features = false }
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
yansi = "1.0"

# Tests build at the uniform dev opt-level (no per-package overrides).
[profile.dev]
opt-level = 1

[profile.release]
debug = 1
