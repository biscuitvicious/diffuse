[workspace]
resolver = "2"
members = [
    "crates/*",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
diffuse-syntax = { path = "crates/diffuse-syntax", version = "0.1.0" }
diffuse-core = { path = "crates/diffuse-core", version = "0.1.0" }
diffuse-render = { path = "crates/diffuse-render", version = "0.1.0" }
diffuse-tui = { path = "crates/diffuse-tui", version = "0.1.0" }

clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
difflib = "0.4"
crossterm = "0.29"
unicode-segmentation = "1.13.3"
unicode-width = "0.2"
gix = { version = "0.87", default-features = false, features = ["basic", "revision", "blob-diff", "parallel", "sha1"] }
rayon = "1.12"
rustc-hash = "2"

[profile.dev.package.regex]
opt-level = 3

[profile.dev.package.regex-automata]
opt-level = 3

[profile.dev.package.regex-syntax]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.release]
debug = 1
